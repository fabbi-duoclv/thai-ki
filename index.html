/* FAQ view */
function fold(str){return String(str).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');}
function faqBtn(label,fn,cls){
  return el('button',{type:'button',class:cls||'',onclick:function(e){e.stopPropagation();fn();}},label);
}
function faqSaveEdit(f,qv,av){
  var isNew=faqEdit&&faqEdit.isNew;faqEdit=null;
  qv=(qv||'').trim();
  if(!qv){ if(isNew)faq.splice(faq.indexOf(f),1); }
  else{ f.q=qv.slice(0,300);f.a=(av||'').trim().slice(0,3000);faqOpen[f.id]=true; }
  render();
}
function faqCancel(f){
  var isNew=faqEdit&&faqEdit.isNew;faqEdit=null;
  if(isNew)faq.splice(faq.indexOf(f),1);
  render();
}
function faqDelete(f){
  var snap=JSON.stringify(faq);
  faq.splice(faq.indexOf(f),1);render();
  toast('Đã xóa câu hỏi','Hoàn tác',function(){faq=normFaq(JSON.parse(snap));render();});
}
function faqMove(f,dir,list){
  var i=faq.indexOf(f),j=i+dir;if(j<0||j>=faq.length)return;
  faq[i]=faq[j];faq[j]=f;save();drawFaqList(list,false);
}
function faqItem(f,list){
  var idx=faq.indexOf(f);
  if(faqEdit&&faqEdit.id===f.id){
    var qi=el('input',{class:'edit',type:'text',maxlength:'300',placeholder:'Câu hỏi','aria-label':'Câu hỏi'});qi.value=f.q;
    var ai=el('textarea',{class:'fq-a-in',rows:'7',maxlength:'3000',placeholder:'Câu trả lời','aria-label':'Câu trả lời'});ai.value=f.a;
    function key(e){
      if(e.key==='Escape'){e.preventDefault();faqCancel(f);}
      else if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();faqSaveEdit(f,qi.value,ai.value);}
    }
    qi.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.ctrlKey&&!e.metaKey){e.preventDefault();ai.focus();}else key(e);});
    ai.addEventListener('keydown',key);
    var card=el('div',{class:'fq-item editing'},qi,ai,
      el('div',{class:'fq-hint'},'Ctrl + Enter để lưu, Esc để hủy.'),
      el('div',{class:'fq-acts'},faqBtn('Hủy',function(){faqCancel(f);}),faqBtn('Lưu',function(){faqSaveEdit(f,qi.value,ai.value);},'primary')));
    card._focus=qi;
    return card;
  }
  var open=!!faqOpen[f.id];
  var head=el('button',{type:'button',class:'fq-q','aria-expanded':String(open),onclick:function(){faqOpen[f.id]=!open;drawFaqList(list,false);}},
    el('span',{class:'fq-n'},(idx+1)+'.'),el('span',{class:'fq-qt'},f.q),el('span',{class:'fq-chev','aria-hidden':'true'},open?'−':'+'));
  var item=el('div',{class:'fq-item'},head);
  if(open){
    item.appendChild(el('div',{class:'fq-body'},
      el('p',{class:'fq-a'+(f.a?'':' emptya')},f.a||'Chưa có câu trả lời. Bấm Sửa để thêm.'),
      el('div',{class:'fq-acts'},
        faqBtn('Sửa',function(){faqEdit={id:f.id,isNew:false};render();}),
        idx>0&&faqBtn('Lên',function(){faqMove(f,-1,list);}),
        idx<faq.length-1&&faqBtn('Xuống',function(){faqMove(f,1,list);}),
        faqBtn('Xóa',function(){faqDelete(f);},'danger'))));
  }
  return item;
}
function drawFaqList(list,focus){
  list.textContent='';
  var qn=fold(faqQuery.trim());
  var items=faq.filter(function(f){return !qn||(faqEdit&&faqEdit.id===f.id)||fold(f.q+' '+f.a).indexOf(qn)>=0;});
  list.appendChild(el('p',{class:'fq-count'},qn?(items.length+' kết quả'):(faq.length+' câu hỏi. Bấm vào câu hỏi để xem câu trả lời.')));
  if(!items.length){
    list.appendChild(el('div',{class:'empty'},qn?'Không có câu nào khớp. Thử từ khóa khác.':'Chưa có câu hỏi nào. Bấm “+ Thêm câu hỏi” để bắt đầu.'));
    return;
  }
  var toFocus=null;
  items.forEach(function(f){var c=faqItem(f,list);if(c._focus)toFocus=c._focus;list.appendChild(c);});
  if(focus&&toFocus){setTimeout(function(){toFocus.focus();toFocus.select();},0);}
}
function renderFaq(host){
  var wrap=el('div',{class:'faq'});
  var search=el('input',{type:'search',class:'fq-search',placeholder:'Tìm trong câu hỏi và câu trả lời','aria-label':'Tìm câu hỏi'});
  search.value=faqQuery;
  var list=el('div',{class:'fq-list'});
  search.addEventListener('input',function(){faqQuery=search.value;drawFaqList(list,false);});
  wrap.appendChild(el('div',{class:'fq-bar'},search,
    el('button',{type:'button',class:'btn',onclick:function(){
      var it={id:nid(),q:'',a:''};faq.unshift(it);faqEdit={id:it.id,isNew:true};faqQuery='';render();
    }},'+ Thêm câu hỏi'),
    el('button',{type:'button',class:'btn',onclick:function(){faq.forEach(function(f){faqOpen[f.id]=true;});drawFaqList(list,false);}},'Mở tất cả'),
    el('button',{type:'button',class:'btn',onclick:function(){faqOpen={};drawFaqList(list,false);}},'Đóng tất cả')));
  wrap.appendChild(list);
  host.appendChild(wrap);
  drawFaqList(list,true);
}

/* main render */
function render(){
  var host=document.getElementById('view');
  var sx=host.scrollLeft,sy=host.scrollTop;
  pendingFocus=null;hideTip();
  host.className=view==='map'?'map':'';
  host.textContent='';
  if(view==='map')renderMap(host);else if(view==='list')renderList(host);else renderFaq(host);
  host.scrollLeft=sx;host.scrollTop=sy;

  var r=stats(root);
  document.getElementById('title').textContent=root.t;
  document.title=root.t;
  document.getElementById('barfill').style.width=(r[1]?Math.round(r[0]/r[1]*100):0)+'%';
  document.getElementById('progtxt').textContent='Đã xong '+r[0]+'/'+r[1]+' mục ('+(r[1]?Math.round(r[0]/r[1]*100):0)+'%)';
  document.getElementById('tabMap').setAttribute('aria-pressed',String(view==='map'));
  document.getElementById('tabList').setAttribute('aria-pressed',String(view==='list'));
  document.getElementById('tabFaq').setAttribute('aria-pressed',String(view==='faq'));
  document.getElementById('expandAll').style.display=view==='faq'?'none':'';
  document.getElementById('collapseAll').style.display=view==='faq'?'none':'';
  document.getElementById('zoomBox').style.display=view==='map'?'':'none';
  document.getElementById('zVal').textContent=Math.round(zoom*100)+'%';
  save();
  if(pendingFocus){pendingFocus.focus();pendingFocus.select();}
}

/* header controls */
function setView(v){view=v;var h=document.getElementById('view');h.scrollLeft=0;h.scrollTop=0;render();}
document.getElementById('tabMap').addEventListener('click',function(){setView('map');});
document.getElementById('tabList').addEventListener('click',function(){setView('list');});
document.getElementById('tabFaq').addEventListener('click',function(){setView('faq');});
document.getElementById('expandAll').addEventListener('click',function(){eachNode(root,function(n){n.open=true;});render();});
document.getElementById('collapseAll').addEventListener('click',function(){eachNode(root,function(n,d){n.open=(d===0);});render();});
document.getElementById('zIn').addEventListener('click',function(){zoom=clampZ(zoom+.1);render();});
document.getElementById('zOut').addEventListener('click',function(){zoom=clampZ(zoom-.1);render();});
document.getElementById('reset').addEventListener('click',function(){
  var snap=JSON.stringify(root),fsnap=JSON.stringify(faq);
  root=seed();faq=seedFaq();selected=null;editing=null;faqEdit=null;render();
  toast('Đã đặt lại sơ đồ và FAQ về mẫu','Hoàn tác',function(){root=norm(JSON.parse(snap));faq=normFaq(JSON.parse(fsnap));render();});
});

/* backup dialog */
var dlg=document.getElementById('dlg'),dlgTxt=document.getElementById('dlgTxt'),dlgMsg=document.getElementById('dlgMsg');
document.getElementById('backup').addEventListener('click',function(){
  dlgTxt.value=JSON.stringify({v:12,root:root,faq:faq});dlgMsg.textContent='';
  if(dlg.showModal)dlg.showModal();else dlg.setAttribute('open','');
});
document.getElementById('dlgClose').addEventListener('click',function(){dlg.close();});
document.getElementById('dlgCopy').addEventListener('click',function(){
  dlgTxt.focus();dlgTxt.select();
  var ok=false;
  try{ok=document.execCommand('copy');}catch(e){}
  dlgMsg.textContent=ok?'Đã sao chép.':'Chưa sao chép được tự động. Hãy nhấn Ctrl+C (hoặc giữ ngón tay rồi chọn Sao chép).';
});
document.getElementById('dlgLoad').addEventListener('click',function(){
  try{
    var o=JSON.parse(dlgTxt.value);
    var nr=norm(o.root||o);if((o.v||0)<12)migrate(nr,o.v||0);
    root=nr;if(Array.isArray(o.faq)){faq=normFaq(o.faq);if((o.v||0)<10)fixFaq(faq);if((o.v||0)<11)addFaq11(faq);if((o.v||0)<12)addFaqRange(faq,30,31);}selected=null;editing=null;faqEdit=null;render();dlg.close();
    toast('Đã nạp dữ liệu');
  }catch(e){dlgMsg.textContent='Dữ liệu không hợp lệ. Hãy dán đúng đoạn văn bản đã sao lưu.';}
});

document.getElementById('view').addEventListener('scroll',hideTip);

/* drag to pan (mouse only) */
(function(){
  var host=document.getElementById('view'),drag=null;
  host.addEventListener('pointerdown',function(e){
    if(view!=='map'||e.pointerType!=='mouse'||e.button!==0)return;
    if(e.target.closest('.node'))return;
    drag={x:e.clientX,y:e.clientY,sl:host.scrollLeft,st:host.scrollTop};
    host.classList.add('drag');
  });
  window.addEventListener('pointermove',function(e){
    if(!drag)return;
    host.scrollLeft=drag.sl-(e.clientX-drag.x);host.scrollTop=drag.st-(e.clientY-drag.y);
  });
  window.addEventListener('pointerup',function(){drag=null;host.classList.remove('drag');});
})();

render();
})();
</script>
